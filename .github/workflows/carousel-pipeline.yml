name: Rally News Carousel Pipeline

# Fully independent of the video pipeline — enable or disable this one on its
# own. Triggered manually via the Actions UI, or externally through the
# workflow_dispatch API (e.g. an external cron-job). GitHub does NOT run this
# on a schedule of its own.
on:
  workflow_dispatch:

jobs:
  generate-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The reel is cut with ffmpeg. Installed explicitly rather than relying on
      # whatever the runner image happens to ship.
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm install

      - name: Run carousel pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RALLY_RSS_URL: ${{ secrets.RALLY_RSS_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # 9:16 Reels/Shorts cut. Without a voice key the reel is skipped and
          # the carousel runs exactly as before.
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REELS_VOICE: ${{ vars.REELS_VOICE }}
          REELS_VOICE_PROVIDER: ${{ vars.REELS_VOICE_PROVIDER }}
          R2_REELS_IMAGE_PREFIX: ${{ vars.R2_REELS_IMAGE_PREFIX }}
          R2_REELS_AUDIO_PREFIX: ${{ vars.R2_REELS_AUDIO_PREFIX }}
          R2_REELS_OUTRO_KEY: ${{ vars.R2_REELS_OUTRO_KEY }}
        run: node carousel.js

      - name: Commit and push updated RSS feed
        run: |
          git config user.name "Rally News Bot"
          git config user.email "pipeline@rallynews.com"
          git add feed.rss
          git diff --cached --quiet || git commit -m "chore: update RSS feed (carousel) [skip ci]"
          git push origin main
