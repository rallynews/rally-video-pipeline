name: Rally News Carousel Produce (after review)

# Runs when the review app commits an approval to review/approved/. Builds and
# delivers the carousel + reel from exactly what was approved. Can also be
# dispatched manually with a specific approved file (e.g. to re-run a day).
on:
  push:
    branches: [main]
    paths:
      - 'review/approved/*.json'
  workflow_dispatch:
    inputs:
      file:
        description: 'Approved draft to produce, e.g. review/approved/2026-07-28.json'
        required: true
        type: string

jobs:
  produce-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # HEAD^ is needed to find which approval this push added.
          fetch-depth: 2

      - name: Resolve approved file
        id: file
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            FILE="${{ inputs.file }}"
          else
            FILE=$(git diff --name-only HEAD^ HEAD -- 'review/approved/*.json' | tail -1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "No approved draft found in this push." >&2
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Producing from $FILE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm install

      - name: Produce and deliver
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RALLY_RSS_URL: ${{ secrets.RALLY_RSS_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          R2_VIDEO_BUCKET: ${{ vars.R2_VIDEO_BUCKET }}
          R2_VIDEO_PUBLIC_URL: ${{ vars.R2_VIDEO_PUBLIC_URL }}
          R2_REELS_IMAGE_PREFIX: ${{ vars.R2_REELS_IMAGE_PREFIX }}
          R2_REELS_GENERIC_PREFIX: ${{ vars.R2_REELS_GENERIC_PREFIX }}
          R2_REELS_AUDIO_PREFIX: ${{ vars.R2_REELS_AUDIO_PREFIX }}
          R2_REELS_OUTRO_PREFIX: ${{ vars.R2_REELS_OUTRO_PREFIX }}
          REELS_VOICE: ${{ vars.REELS_VOICE }}
          REELS_TTS_MODEL: ${{ vars.REELS_TTS_MODEL }}
          REELS_VOICE_PROVIDER: ${{ vars.REELS_VOICE_PROVIDER }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node carousel.js produce "${{ steps.file.outputs.file }}"

      - name: Commit and push updated RSS feed
        run: |
          git config user.name "Rally News Bot"
          git config user.email "pipeline@rallynews.com"
          git add feed.rss
          git diff --cached --quiet || git commit -m "chore: update RSS feed (carousel) [skip ci]"
          git pull --rebase origin main
          git push origin main
